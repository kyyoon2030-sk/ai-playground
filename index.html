<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Playground | Learn AI by Doing</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17253b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:24px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:850;font-size:21px}select,textarea,button{font:inherit}select,textarea{border:1px solid #d6dcec;border-radius:12px;background:white;padding:11px}h1{font-size:clamp(30px,6vw,48px);line-height:1.12;margin:32px 0 10px}p{line-height:1.6;color:#56657b}.pill{display:inline-block;background:#e9e8ff;color:#4939a7;border-radius:30px;padding:7px 12px;font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;margin-top:24px}.card,.panel{background:white;border:1px solid #e4e8f2;border-radius:19px;padding:20px;box-shadow:0 8px 24px #1e305008}.card{cursor:pointer;text-align:left;min-height:160px}.card:hover,.card:focus-visible{border-color:#7869e9;outline:2px solid #b5aafa}.emoji{font-size:30px}.card h3{margin:12px 0 5px}.card p{margin:0;font-size:14px}.panel{margin-top:22px}label{display:block;font-weight:700;margin:15px 0 7px}textarea{width:100%;min-height:90px;resize:vertical}.prompt{white-space:pre-wrap;background:#f3f5fa;border-radius:12px;padding:16px;line-height:1.6;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}button.action{background:#5544d8;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:750;cursor:pointer}button.secondary{background:#eae8ff;color:#4030a9}button:disabled{opacity:.5}.muted{font-size:13px;color:#69778a}.progress{height:10px;background:#e9edf6;border-radius:20px;overflow:hidden}.bar{height:100%;background:#6e60e9;width:0%;transition:width .2s}.hidden{display:none}footer{margin-top:28px;font-size:12px;color:#718096}
</style></head><body><main class="wrap">
<header><div class="logo">✨ AI Playground</div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></header>
<section><span class="pill" id="tag"></span><h1 id="headline"></h1><p id="intro"></p><div class="panel"><div id="progressText"></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div></div></section>
<section><div class="grid" id="missions"></div></section>
<section class="panel hidden" id="workspace"><div class="pill" id="missionTag"></div><h2 id="missionTitle"></h2><p id="missionHelp"></p><label for="details" id="detailsLabel"></label><textarea id="details" maxlength="600"></textarea><label id="promptLabel"></label><div class="prompt" id="prompt"></div><div class="actions"><button class="action" id="copy"></button><button class="action secondary" id="complete"></button></div><p class="muted" id="tip"></p><p class="muted" id="status" aria-live="polite"></p></section>
<footer id="footer"></footer></main>
<script>
const data={
ko:{tag:"하루 5분 · 직접 해보는 AI",headline:"AI는 공부보다 체험이 먼저!",intro:"미션 하나를 고르고, 내 상황을 입력하고, AI에게 부탁해 보세요. 코딩도 가입도 필요 없어요.",progress:"완료한 미션",of:"/ 3",missions:[["🧳","나만의 여행 플래너","조건을 추가하면 답이 어떻게 달라질까요?","여행지, 날짜, 예산, 좋아하는 활동을 적어 보세요.","예: 도쿄 하루 여행, 예산 10만원, 카페와 산책을 좋아해요.","친절한 여행 플래너가 되어 주세요. 아래 조건으로 하루 여행 코스를 오전·점심·오후로 나누어 제안하고, 예상 이동 시간과 선택 이유를 알려 주세요."],["✉️","이메일 마법사","막막한 이메일을 1분 안에 초안으로!","누구에게 어떤 목적으로 쓰는지 적어 보세요.","예: 호텔에 늦은 체크인 가능 여부를 영어로 물어보기.","친절한 글쓰기 도우미가 되어 주세요. 아래 상황에 맞는 정중하고 간결한 이메일을 제목과 함께 작성해 주세요. 필요하면 자연스러운 영어 문장도 제안해 주세요."],["💡","아이디어 발전소","평범한 생각을 작은 프로젝트로!","관심사나 해결하고 싶은 문제를 적어 보세요.","예: 기타 연습을 꾸준히 하고 싶어요.","창의적인 아이디어 파트너가 되어 주세요. 아래 관심사나 문제에 대해 간단하고 재미있는 프로젝트 아이디어 세 가지와 오늘 바로 할 수 있는 첫 행동을 제안해 주세요."]],mission:"미션",details:"내 상황",prompt:"AI에게 보낼 요청문",copy:"📋 요청문 복사",complete:"✓ 미션 완료 표시",done:"완료했어요! 다른 미션도 도전해 보세요.",copied:"복사했어요! 원하는 AI 채팅에 붙여넣으세요.",copyFail:"자동 복사가 안 되면 요청문을 직접 선택해 복사하세요.",tip:"팁: AI의 답변을 그대로 믿지 말고, 조건을 바꿔 다시 질문해 보세요.",footer:"학습용 시제품 · 입력 내용은 서버로 전송하지 않습니다. 진행 상황만 이 브라우저에 저장됩니다.",instruction:"전문 용어를 피하고 초보자도 이해할 수 있게 답변해 주세요.",empty:"구체적인 예시를 하나 만들어 주세요."},
en:{tag:"5 minutes a day · Learn by doing",headline:"Don't just study AI. Try it!",intro:"Pick a mission, describe your situation, and ask AI. No coding or signup needed.",progress:"Missions completed",of:"/ 3",missions:[["🧳","Travel Planner","See how adding constraints changes the answer.","Describe your destination, dates, budget and interests.","e.g. One day in Tokyo, $80 budget, love cafés and walking.","Act as a friendly travel planner. Based on the situation below, propose a one-day itinerary for morning, lunch and afternoon, including approximate travel times and reasons for your choices."],["✉️","Email Wizard","Turn a tricky email into a first draft.","Who are you writing to, and why?","e.g. Ask a hotel about late check-in.","Act as a helpful writing assistant. Draft a polite, concise email with a subject line for the situation below."],["💡","Idea Lab","Turn an ordinary thought into a mini-project.","Describe an interest or problem.","e.g. I want to practice guitar more often.","Act as a creative partner. Suggest three small, fun project ideas for the interest or problem below, with one action I can take today."]],mission:"Mission",details:"Your situation",prompt:"Your AI prompt",copy:"📋 Copy prompt",complete:"✓ Mark complete",done:"Nice work! Try another mission.",copied:"Copied! Paste it into your favorite AI chat.",copyFail:"Please select and copy the prompt manually.",tip:"Tip: Check AI's answers, change a constraint, and ask again.",footer:"Learning prototype · Your text is not sent to a server. Progress stays in this browser.",instruction:"Avoid jargon and explain things clearly for a beginner.",empty:"Please create a specific example."},
ja:{tag:"1日5分 · 体験しながら学ぶAI",headline:"AIは勉強より、まず体験！",intro:"ミッションを選び、状況を入力してAIに頼んでみましょう。プログラミングも登録も不要です。",progress:"完了したミッション",of:"/ 3",missions:[["🧳","旅行プランナー","条件を加えると回答はどう変わる？","行き先、日程、予算、好きなことを書いてください。","例：東京で1日、予算1万円、カフェと散歩が好き。","親切な旅行プランナーとして、次の条件に合わせて午前・昼・午後の1日プランを提案し、移動時間の目安と理由を説明してください。"],["✉️","メールの達人","難しいメールもすぐに下書き！","誰に、何のために送るかを書いてください。","例：ホテルに遅いチェックインが可能か聞きたい。","親切な文章アシスタントとして、次の状況に合った丁寧で簡潔なメールを件名付きで作成してください。"],["💡","アイデア研究室","小さなアイデアを形にしよう！","興味や解決したい問題を書いてください。","例：ギターの練習を習慣にしたい。","創造的なパートナーとして、次の関心事や問題に対して、簡単で楽しいプロジェクト案を3つと、今日できる最初の行動を提案してください。"]],mission:"ミッション",details:"あなたの状況",prompt:"AIへの依頼文",copy:"📋 依頼文をコピー",complete:"✓ 完了にする",done:"お疲れさま！次のミッションにも挑戦しましょう。",copied:"コピーしました！AIチャットに貼り付けてください。",copyFail:"依頼文を選択して手動でコピーしてください。",tip:"ヒント：AIの回答を確認し、条件を変えて再質問してみましょう。",footer:"学習用試作品 · 入力内容はサーバーに送信されません。進捗のみブラウザに保存されます。",instruction:"専門用語を避け、初心者にもわかりやすく説明してください。",empty:"具体的な例を一つ作ってください。"}};
const $=id=>document.getElementById(id);let lang="ko",selected=null,finished=[];
try{lang=localStorage.getItem("aip_lang")||"ko";finished=JSON.parse(localStorage.getItem("aip_done")||"[]");if(!Array.isArray(finished))finished=[]}catch(e){finished=[]}
if(!data[lang])lang="ko";$("language").value=lang;
function render(){const t=data[lang];document.documentElement.lang=lang;$("tag").textContent=t.tag;$("headline").textContent=t.headline;$("intro").textContent=t.intro;$("progressText").textContent=t.progress+": "+finished.length+" "+t.of;$("bar").style.width=(finished.length/3*100)+"%";$("progress").setAttribute("aria-valuenow",finished.length);$("missions").replaceChildren();t.missions.forEach((m,i)=>{const b=document.createElement("button");b.className="card";const emoji=document.createElement("div");emoji.className="emoji";emoji.textContent=m[0];const h=document.createElement("h3");h.textContent=m[1]+(finished.includes(i)?" ✓":"");const p=document.createElement("p");p.textContent=m[2];b.append(emoji,h,p);b.addEventListener("click",()=>{selected=i;$("details").value="";renderWorkspace();$("workspace").scrollIntoView({behavior:"smooth",block:"start"})});$("missions").append(b)});$("footer").textContent=t.footer;if(selected!==null)renderWorkspace()}
function renderWorkspace(){const t=data[lang],m=t.missions[selected];$("workspace").classList.remove("hidden");$("missionTag").textContent=t.mission+" "+(selected+1);$("missionTitle").textContent=m[1];$("missionHelp").textContent=m[2];$("detailsLabel").textContent=m[3];$("details").placeholder=m[4];$("promptLabel").textContent=t.prompt;$("copy").textContent=t.copy;$("complete").textContent=t.complete;$("tip").textContent=t.tip;$("status").textContent="";updatePrompt()}
function updatePrompt(){if(selected===null)return;const t=data[lang];$("prompt").textContent=t.missions[selected][5]+"\n\n"+($("details").value.trim()||t.empty)+"\n\n"+t.instruction}
$("language").addEventListener("change",e=>{lang=e.target.value;try{localStorage.setItem("aip_lang",lang)}catch(_){}render()});
$("details").addEventListener("input",updatePrompt);
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("prompt").textContent);$("status").textContent=data[lang].copied}catch(e){$("status").textContent=data[lang].copyFail}});
$("complete").addEventListener("click",()=>{if(selected!==null&&!finished.includes(selected)){finished.push(selected);try{localStorage.setItem("aip_done",JSON.stringify(finished))}catch(_){}}render();$("status").textContent=data[lang].done});
render();
</script></body></html>
